<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trắc nghiệm Hóa học: Nitric Acid (HNO₃)</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          boxShadow: {
            soft: '0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 15px -3px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    sub {
      bottom: -0.22em;
      font-size: 0.75em;
      line-height: 0;
      position: relative;
      vertical-align: baseline;
    }
    sup {
      top: -0.35em;
      font-size: 0.75em;
      line-height: 0;
      position: relative;
      vertical-align: baseline;
    }
    .fade-enter {
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .shake-anim {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }
    .bounce-success {
      animation: bounceSuccess 0.4s ease-out;
    }
    @keyframes bounceSuccess {
      0% { transform: scale(0.98); }
      50% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-slate-100 min-h-screen text-slate-800 font-sans flex flex-col justify-between p-4 sm:p-6 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="max-w-2xl mx-auto w-full pt-2 sm:pt-4 pb-2 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/90 border border-indigo-100 shadow-sm text-indigo-700 text-xs sm:text-sm font-semibold mb-2">
      <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
      </svg>
      Ôn tập Hóa học THPT (12 Câu hỏi)
    </div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
      Trắc nghiệm Hóa học: Nitric Acid (<span class="text-indigo-600">HNO<sub>3</sub></span>)
    </h1>
  </header>

  <!-- Main Card Container -->
  <main class="max-w-2xl mx-auto w-full my-auto py-3">
    <div class="bg-white rounded-3xl p-5 sm:p-8 shadow-soft border border-slate-150/90 transition-all duration-300">
      
      <!-- Progress Bar & Status (Hidden on Result Screen) -->
      <div id="quiz-header" class="mb-5">
        <div class="flex items-center justify-between text-xs sm:text-sm font-semibold text-slate-500 mb-2.5">
          <span id="question-tracker" class="flex items-center gap-1.5 font-bold text-slate-700">Câu hỏi 1 / 12</span>
          <span id="score-counter" class="text-indigo-600 font-bold bg-indigo-50 border border-indigo-100/70 px-2.5 py-1 rounded-full">Đúng lần đầu: 0/12</span>
        </div>
        <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden p-0.5">
          <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 to-indigo-600 rounded-full transition-all duration-300 w-[8.33%]"></div>
        </div>
      </div>

      <!-- Question & Interactive Area -->
      <div id="quiz-content" class="fade-enter">
        <div id="question-text" class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed mb-4 min-h-[50px]">
          <!-- Question text injected here -->
        </div>

        <!-- Interactive Notice Banner for Incorrect/Correct tries -->
        <div id="status-alert" class="hidden mb-4 p-3 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-2 transition-all">
          <span id="status-icon" class="flex-shrink-0"></span>
          <span id="status-message"></span>
        </div>

        <!-- Options Container -->
        <div id="options-container" class="space-y-3">
          <!-- Options injected dynamically -->
        </div>

        <!-- Next Question Action Area -->
        <div class="mt-6 flex justify-end">
          <button id="next-btn" class="hidden items-center justify-center gap-2 px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold shadow-md shadow-indigo-200 transition-all duration-200 w-full sm:w-auto">
            <span>Câu tiếp theo</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="hidden text-center py-4 fade-enter">
        <div class="w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center shadow-inner" id="result-badge">
          <!-- Score Badge Icon -->
        </div>
        <h3 class="text-2xl font-bold text-slate-900 mb-1" id="result-headline">Chúc mừng bạn!</h3>
        <p class="text-slate-500 text-sm mb-6" id="result-feedback">Bạn đã vượt qua toàn bộ 12 câu hỏi ôn tập.</p>

        <!-- Score summary stats -->
        <div class="bg-slate-50 rounded-2xl p-5 mb-6 border border-slate-100 grid grid-cols-2 gap-4">
          <div class="text-center border-r border-slate-200">
            <span class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Đúng lần đầu</span>
            <span class="text-2xl sm:text-3xl font-extrabold text-slate-800" id="final-score">0 / 12</span>
          </div>
          <div class="text-center">
            <span class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Tổng lần thử sai</span>
            <span class="text-2xl sm:text-3xl font-extrabold text-rose-500" id="final-wrongs">0</span>
          </div>
        </div>

        <button id="restart-btn" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold shadow-md shadow-indigo-200 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Làm lại bài thi
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-slate-400 py-3">
    Chế độ rèn luyện: Sai được bấm lại cho đến khi tìm ra đáp án đúng • Nitric Acid THPT
  </footer>

  <script>
    // Dữ liệu trọn bộ 12 câu hỏi trắc nghiệm
    const questions = [
      // 6 CÂU BAN ĐẦU
      {
        question: "Công thức hóa học của nitric acid là:",
        options: [
          "HCl",
          "HNO<sub>3</sub>",
          "H<sub>2</sub>SO<sub>4</sub>",
          "H<sub>2</sub>CO<sub>3</sub>"
        ],
        correct: 1 // B
      },
      {
        question: "Trong HNO<sub>3</sub>, số oxi hóa của N là:",
        options: [
          "-3",
          "+3",
          "+5",
          "+7"
        ],
        correct: 2 // C
      },
      {
        question: "HNO<sub>3</sub> tinh khiết ở điều kiện thường là:",
        options: [
          "Chất rắn, màu trắng",
          "Chất lỏng, không màu",
          "Chất khí, không màu",
          "Chất lỏng, màu vàng"
        ],
        correct: 1 // B
      },
      {
        question: "Phản ứng nào sau đây thể hiện tính acid của HNO<sub>3</sub>?",
        options: [
          "NH<sub>3</sub> + HNO<sub>3</sub> → NH<sub>4</sub>NO<sub>3</sub>",
          "Au + HNO<sub>3</sub> + HCl → AuCl<sub>3</sub> + NO + H<sub>2</sub>O",
          "N<sub>2</sub> + O<sub>2</sub> ⇌ 2NO",
          "NO<sub>2</sub> + O<sub>2</sub> → N<sub>2</sub>O<sub>5</sub>"
        ],
        correct: 0 // A
      },
      {
        question: "HNO<sub>3</sub> có tính oxi hóa mạnh chủ yếu vì:",
        options: [
          "N có số oxi hóa +5",
          "H có số oxi hóa +1",
          "O có số oxi hóa -2",
          "HNO<sub>3</sub> tan vô hạn trong nước"
        ],
        correct: 0 // A
      },
      {
        question: "Phản ứng giữa HNO<sub>3</sub> và CaCO<sub>3</sub> tạo ra:",
        options: [
          "Ca(NO<sub>3</sub>)<sub>2</sub> + CO<sub>2</sub> + H<sub>2</sub>O",
          "CaO + NO<sub>2</sub> + H<sub>2</sub>O",
          "Ca(NO<sub>2</sub>)<sub>2</sub> + CO<sub>2</sub> + H<sub>2</sub>O",
          "Ca + NO<sub>3</sub> + CO<sub>2</sub>"
        ],
        correct: 0 // A
      },
      // 6 CÂU MỚI BỔ SUNG
      {
        question: `Cho các phát biểu sau về HNO<sub>3</sub>:<br>
          <span class="font-normal block mt-1.5 space-y-0.5 text-slate-700">
            (1) N trong HNO<sub>3</sub> có số oxi hóa +5.<br>
            (2) HNO<sub>3</sub> có tính acid vì có khả năng cho proton.<br>
            (3) HNO<sub>3</sub> chỉ có tính acid, không có tính oxi hóa.<br>
            (4) Liên kết N → O là liên kết cho – nhận.
          </span>
          <span class="block mt-2 font-semibold">Có bao nhiêu phát biểu đúng?</span>`,
        options: [
          "1",
          "2",
          "3 (gồm 1, 2 và 4)",
          "4"
        ],
        correct: 2 // C (1, 2, 4 đúng)
      },
      {
        question: `Cho các phản ứng:<br>
          <span class="font-normal block mt-1.5 space-y-0.5 text-slate-700">
            (1) NH<sub>3</sub> + HNO<sub>3</sub> → NH<sub>4</sub>NO<sub>3</sub><br>
            (2) CaCO<sub>3</sub> + 2HNO<sub>3</sub> → Ca(NO<sub>3</sub>)<sub>2</sub> + CO<sub>2</sub> + H<sub>2</sub>O<br>
            (3) Au + HNO<sub>3</sub> + 3HCl → AuCl<sub>3</sub> + NO + 2H<sub>2</sub>O
          </span>
          <span class="block mt-2 font-semibold">HNO<sub>3</sub> thể hiện tính acid trong bao nhiêu phản ứng?</span>`,
        options: [
          "1",
          "2 (gồm phản ứng 1 và 2)",
          "3",
          "Không có phản ứng nào"
        ],
        correct: 1 // B
      },
      {
        question: `Trong phản ứng: <b>Au + HNO<sub>3</sub> + 3HCl → AuCl<sub>3</sub> + NO + 2H<sub>2</sub>O</b><br>
          <span class="block mt-1 font-semibold">Nhận xét nào đúng nhất?</span>`,
        options: [
          "HNO<sub>3</sub> đóng vai trò chất khử.",
          "HNO<sub>3</sub> đóng vai trò chất oxi hóa.",
          "HCl đóng vai trò chất oxi hóa duy nhất.",
          "HNO<sub>3</sub> chỉ thể hiện tính acid."
        ],
        correct: 1 // B
      },
      {
        question: "Vì sao HNO<sub>3</sub> có thể vừa thể hiện tính acid vừa thể hiện tính oxi hóa mạnh?",
        options: [
          "Vì HNO<sub>3</sub> có H và N đều có số oxi hóa dương.",
          "Vì HNO<sub>3</sub> vừa có khả năng cho H<sup>+</sup>, vừa chứa N ở số oxi hóa cao nhất (+5).",
          "Vì HNO<sub>3</sub> tan vô hạn trong nước.",
          "Vì HNO<sub>3</sub> là chất lỏng không màu."
        ],
        correct: 1 // B
      },
      {
        question: `Có 3 nhận xét sau:<br>
          <span class="font-normal block mt-1.5 space-y-0.5 text-slate-700">
            (1) HNO<sub>3</sub> tinh khiết có nhiệt độ sôi khoảng 83°C.<br>
            (2) HNO<sub>3</sub> tan vô hạn trong nước.<br>
            (3) HNO<sub>3</sub> có thể dùng để sản xuất ammonium nitrate.
          </span>
          <span class="block mt-2 font-semibold">Tập hợp đáp án đúng là:</span>`,
        options: [
          "Chỉ nhận xét 1",
          "Chỉ nhận xét 2 và 3",
          "Cả 1, 2 và 3",
          "Chỉ nhận xét 1 và 3"
        ],
        correct: 2 // C
      },
      {
        question: "Phản ứng nào sau đây <b>không phải</b> là minh họa cho tính acid của HNO<sub>3</sub>?",
        options: [
          "NH<sub>3</sub> + HNO<sub>3</sub> → NH<sub>4</sub>NO<sub>3</sub>",
          "CaCO<sub>3</sub> + 2HNO<sub>3</sub> → Ca(NO<sub>3</sub>)<sub>2</sub> + CO<sub>2</sub> + H<sub>2</sub>O",
          "Au + HNO<sub>3</sub> + 3HCl → AuCl<sub>3</sub> + NO + 2H<sub>2</sub>O",
          "Cả A và B đều là tính acid"
        ],
        correct: 2 // C
      }
    ];

    // Trạng thái ứng dụng
    let currentIdx = 0;
    let firstTryCorrectCount = 0;
    let totalWrongAttempts = 0;
    let hasFailedThisQuestion = false;
    let isCurrentQuestionSolved = false;

    // Các phần tử DOM
    const quizHeader = document.getElementById("quiz-header");
    const quizContent = document.getElementById("quiz-content");
    const resultScreen = document.getElementById("result-screen");
    const questionTracker = document.getElementById("question-tracker");
    const scoreCounter = document.getElementById("score-counter");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const statusAlert = document.getElementById("status-alert");
    const statusIcon = document.getElementById("status-icon");
    const statusMessage = document.getElementById("status-message");
    const nextBtn = document.getElementById("next-btn");
    const restartBtn = document.getElementById("restart-btn");

    function hideAlert() {
      statusAlert.className = "hidden";
      statusIcon.innerHTML = "";
      statusMessage.textContent = "";
    }

    function showAlert(type, message) {
      statusAlert.classList.remove("hidden");
      if (type === "error") {
        statusAlert.className = "mb-4 p-3 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-2 bg-rose-50 text-rose-700 border border-rose-200 fade-enter";
        statusIcon.innerHTML = `
          <svg class="w-5 h-5 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        `;
      } else {
        statusAlert.className = "mb-4 p-3 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-2 bg-emerald-50 text-emerald-700 border border-emerald-200 fade-enter";
        statusIcon.innerHTML = `
          <svg class="w-5 h-5 text-emerald-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        `;
      }
      statusMessage.innerHTML = message;
    }

    // Tải câu hỏi
    function loadQuestion() {
      isCurrentQuestionSolved = false;
      hasFailedThisQuestion = false;
      hideAlert();

      const q = questions[currentIdx];

      // Cập nhật thanh tiến độ và thông tin
      questionTracker.textContent = `Câu hỏi ${currentIdx + 1} / ${questions.length}`;
      scoreCounter.textContent = `Đúng lần đầu: ${firstTryCorrectCount}/${questions.length}`;
      progressBar.style.width = `${((currentIdx + 1) / questions.length) * 100}%`;

      questionText.innerHTML = `<span class="text-indigo-600 font-extrabold mr-1">Câu ${currentIdx + 1}:</span> ${q.question}`;
      optionsContainer.innerHTML = "";
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn group w-full flex items-center justify-between p-3 sm:p-4 rounded-2xl border-2 border-slate-200/80 bg-slate-50/50 hover:bg-slate-100 hover:border-slate-300 text-left transition-all duration-150 active:scale-[0.99] text-slate-800 cursor-pointer";

        btn.innerHTML = `
          <div class="flex items-center gap-3 w-full pr-2">
            <span class="badge-letter flex-shrink-0 w-8 h-8 rounded-xl bg-white border border-slate-200 text-slate-700 font-bold text-sm flex items-center justify-center shadow-xs transition-colors group-hover:border-slate-300">
              ${letters[index]}
            </span>
            <span class="text-sm sm:text-base font-medium leading-relaxed">${optText}</span>
          </div>
          <div class="icon-indicator flex-shrink-0 ml-1"></div>
        `;

        btn.addEventListener("click", () => handleSelectOption(index, btn));
        optionsContainer.appendChild(btn);
      });

      // Ẩn nút "Câu tiếp theo" cho đến khi người dùng chọn đúng
      nextBtn.classList.add("hidden");
      if (currentIdx === questions.length - 1) {
        nextBtn.querySelector("span").textContent = "Xem kết quả bài thi";
      } else {
        nextBtn.querySelector("span").textContent = "Câu tiếp theo";
      }

      // Kích hoạt animation xuất hiện
      quizContent.classList.remove("fade-enter");
      void quizContent.offsetWidth;
      quizContent.classList.add("fade-enter");
    }

    // Xử lý khi bấm chọn 1 phương án
    function handleSelectOption(selectedIndex, btn) {
      if (isCurrentQuestionSolved) return; // Đã xong câu này thì không click nữa

      const q = questions[currentIdx];
      const isCorrect = (selectedIndex === q.correct);
      const letterBadge = btn.querySelector(".badge-letter");
      const iconDiv = btn.querySelector(".icon-indicator");

      if (isCorrect) {
        // --- CHỌN ĐÚNG ---
        isCurrentQuestionSolved = true;

        if (!hasFailedThisQuestion) {
          firstTryCorrectCount++;
          scoreCounter.textContent = `Đúng lần đầu: ${firstTryCorrectCount}/${questions.length}`;
        }

        // Đổi màu xanh lá thành công
        btn.classList.remove("bg-slate-50/50", "border-slate-200/80", "hover:bg-slate-100", "hover:border-slate-300");
        btn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-950", "bounce-success");
        letterBadge.classList.remove("bg-white", "text-slate-700", "border-slate-200");
        letterBadge.classList.add("bg-emerald-600", "text-white", "border-emerald-600");
        
        iconDiv.innerHTML = `
          <span class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
            </svg>
          </span>
        `;

        // Khóa tất cả các phương án còn lại
        const allButtons = optionsContainer.querySelectorAll(".option-btn");
        allButtons.forEach((b) => {
          b.disabled = true;
          b.classList.remove("hover:bg-slate-100", "hover:border-slate-300", "active:scale-[0.99]", "cursor-pointer");
          b.classList.add("cursor-default");
          if (b !== btn) {
            b.classList.add("opacity-45");
          }
        });

        // Thông báo chúc mừng & mở nút Câu tiếp theo
        const successMsg = hasFailedThisQuestion 
          ? "Chính xác rồi! Bạn đã tìm ra phương án đúng." 
          : "Chính xác tuyệt đối ngay lần thử đầu tiên! 🎉";
        showAlert("success", successMsg);
        nextBtn.classList.remove("hidden");

      } else {
        // --- CHỌN SAI: Ở LẠI CÂU HỎI ĐỂ CHỌN TIẾP ---
        hasFailedThisQuestion = true;
        totalWrongAttempts++;

        // Vô hiệu hóa nút sai này và đổi sang màu đỏ kèm hiệu ứng rung
        btn.disabled = true;
        btn.classList.remove("hover:bg-slate-100", "hover:border-slate-300", "active:scale-[0.99]", "cursor-pointer", "bg-slate-50/50", "border-slate-200/80");
        btn.classList.add("bg-rose-50", "border-rose-400", "text-rose-950", "cursor-not-allowed", "shake-anim");
        letterBadge.classList.remove("bg-white", "text-slate-700", "border-slate-200");
        letterBadge.classList.add("bg-rose-500", "text-white", "border-rose-500");

        iconDiv.innerHTML = `
          <span class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </span>
        `;

        // Thông báo nhắc người dùng thử tiếp mà không lộ đáp án đúng
        showAlert("error", "Chưa chính xác! Bạn hãy đọc kỹ lại dữ kiện và thử chọn phương án khác nhé.");

        setTimeout(() => {
          btn.classList.remove("shake-anim");
        }, 400);
      }
    }

    // Sự kiện bấm nút Next / Hoàn thành
    nextBtn.addEventListener("click", () => {
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        loadQuestion();
      } else {
        showResults();
      }
    });

    // Màn hình kết quả
    function showResults() {
      quizHeader.classList.add("hidden");
      quizContent.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const finalScoreEl = document.getElementById("final-score");
      const finalWrongsEl = document.getElementById("final-wrongs");
      const resultBadge = document.getElementById("result-badge");
      const headline = document.getElementById("result-headline");
      const feedback = document.getElementById("result-feedback");

      finalScoreEl.textContent = `${firstTryCorrectCount} / ${questions.length}`;
      finalWrongsEl.textContent = `${totalWrongAttempts} lần`;

      if (firstTryCorrectCount === questions.length) {
        resultBadge.className = "w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center bg-emerald-100 text-emerald-600";
        resultBadge.innerHTML = `
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
          </svg>
        `;
        headline.textContent = "Xuất sắc tuyệt đối!";
        feedback.textContent = `Bạn đã trả lời chính xác tất cả ${questions.length} câu hỏi ngay từ lần lựa chọn đầu tiên! Nắm rất vững kiến thức Nitric Acid.`;
      } else if (firstTryCorrectCount >= 8) {
        resultBadge.className = "w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center bg-indigo-100 text-indigo-600";
        resultBadge.innerHTML = `
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5" />
          </svg>
        `;
        headline.textContent = "Kết quả rất tốt!";
        feedback.textContent = `Bạn đã hoàn thành tốt 12 câu hỏi và tự khám phá ra tất cả đáp án chính xác của bài học.`;
      } else {
        resultBadge.className = "w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center bg-amber-100 text-amber-600";
        resultBadge.innerHTML = `
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        `;
        headline.textContent = "Đã hoàn thành bài ôn tập!";
        feedback.textContent = "Bạn đã kiên trì thử các phương án để tìm ra đáp án đúng. Hãy luyện tập thêm để tự tin làm đúng ngay lần đầu nhé!";
      }
    }

    // Làm lại bài thi
    restartBtn.addEventListener("click", () => {
      firstTryCorrectCount = 0;
      totalWrongAttempts = 0;
      currentIdx = 0;
      resultScreen.classList.add("hidden");
      quizHeader.classList.remove("hidden");
      quizContent.classList.remove("hidden");
      loadQuestion();
    });

    // Chạy câu đầu tiên khi load xong
    window.addEventListener("DOMContentLoaded", loadQuestion);
  </script>
</body>
</html>
